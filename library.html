<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Saved notes</title>
<link rel="stylesheet" href="ui.css">
<style>
  main { max-width: 760px; margin: 0 auto; padding: 16px; display: grid; gap: 10px; }
  .item { border: 2px solid var(--k); background: var(--g1); padding: 10px 12px; display: grid; gap: 6px; }
  .item h3 { margin: 0; font-size: 15px; }
  .meta { font-family: var(--mono); font-size: 11px; color: #444; word-break: break-all; }
  .row button { padding: 5px 10px; }
</style>
</head>
<body>
<div class="top"><h1>Saved notes</h1></div>
<main>
  <input id="q" type="text" placeholder="Search by title or course">
  <div class="row">
    <button id="clearProcessing" type="button">Clear processing files</button>
    <label class="check"><input id="includeFigures" type="checkbox"> Also remove figures from saved notes</label>
  </div>
  <div id="status" role="status"></div>
  <div id="list"></div>
</main>
<script type="module" src="library.js"></script>
</body>
</html>
