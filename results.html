<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture summary</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="lib/katex/katex.min.css">
<link rel="stylesheet" href="assistant.css">
<link rel="stylesheet" href="notes.css">
</head>
<body>
  <div class="bar2">
    <button id="copy" title="Copy the text summary (figures become [Figure N] references)">Copy text</button>
    <button id="zip" title="summary.md + summary.html + images + frames.json">Bundle .zip</button>
    <button id="print">Save as PDF</button>
    <button id="saveHtml">Save as HTML</button>
    <span class="spacer"></span>
    <button id="undoEdit" type="button" title="Undo the last change to the notes" hidden disabled>Undo</button>
    <button id="redoEdit" type="button" title="Redo" hidden disabled>Redo</button>
    <button id="editNotes" type="button" aria-pressed="false" title="Edit the text and move or remove the figures">Edit notes</button>
    <button id="repair" type="button">Fix formatting</button>
    <button id="practice" hidden>Generate practice paper</button>
    <button id="debug" title="TEMP: full plain-text log of every step (transcript, frames, AI calls)" hidden>Debug dump</button>
  </div>
  <div class="meta" id="meta"></div>
  <div class="status" id="status">Loading...</div>
  <article id="out"></article>
  <dialog id="htmlDialog" aria-labelledby="htmlTitle">
    <h2 id="htmlTitle">Save as HTML</h2>
    <p id="htmlStatus" role="status" aria-live="polite"></p>
    <button id="saveLibrary" type="button">Choose library folder</button>
    <button id="saveStandalone" type="button">Save standalone HTML</button>
    <button id="openLibrary" type="button" title="Read the library here with the notes assistant">Open library with the assistant</button>
    <form method="dialog"><button>Close</button></form>
  </dialog>
  <dialog id="paperDialog" aria-labelledby="paperTitle">
    <h2 id="paperTitle">Generate practice paper</h2>
    <form id="paperForm">
      <label for="useAssignments">Add assignment or sample questions?</label>
      <select id="useAssignments"><option value="no">No</option><option value="yes">Yes</option></select>
      <div id="assignmentInputs" hidden>
        <label for="assignmentText">Paste assignment or sample questions</label>
        <textarea id="assignmentText"></textarea>
        <label for="assignmentFiles">Upload question screenshots</label>
        <input id="assignmentFiles" type="file" accept="image/*" multiple>
        <p>OCR runs locally. Images are sent for questions that need visual interpretation or OCR verification.</p>
      </div>
      <div id="paperStatus" role="status" aria-live="polite"></div>
      <button type="submit" id="paperSubmit">Generate</button>
      <button type="button" id="paperCancel">Not now</button>
    </form>
  </dialog>
  <dialog id="repairDialog" aria-labelledby="repairTitle">
    <h2 id="repairTitle">Use Cheap AI to check formatting?</h2>
    <p id="repairDetails"></p>
    <form method="dialog">
      <button value="no" autofocus>No</button>
      <button value="yes">Yes</button>
    </form>
  </dialog>
  <div class="lightbox" id="lb" hidden><img id="lbimg" alt=""><a id="lbopen" target="_blank" rel="noopener">Open original</a></div>
  <div class="toast" id="toast"></div>
  <script src="lib/katex/katex.min.js"></script>
  <script type="module" src="results.js"></script>
</body>
</html>
