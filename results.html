<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lecture summary</title>
<link rel="stylesheet" href="ui.css">
<link rel="stylesheet" href="lib/katex/katex.min.css">
<link rel="stylesheet" href="assistant.css">
<style>
  body { font-size: 15px; line-height: 1.65; }
  .bar2 { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 12px; background: var(--k); }
  .bar2 button { background: var(--w); padding: 6px 10px; }
  .bar2 button:hover { background: var(--y); color: var(--k); }
  .meta { font-family: var(--mono); font-size: 11px; padding: 10px 20px 0; color: #444; max-width: 760px; margin: 0 auto; }
  .status { padding: 24px 20px; font-family: var(--mono); font-size: 12px; }
  article { max-width: 760px; margin: 0 auto; padding: 4px 20px 56px; overflow-wrap: anywhere; }
  .wide-preview > article, .wide-preview > .meta { max-width: 1080px; }
  @media print {
    .bar2, .toast, .meta { display: none; }
    body > article, body > article > article { width: auto; max-width: none; margin: 0; padding: 0; }
    body article table { display: table; width: 100%; }
  }
  h1 { font-size: 26px; font-weight: 800; line-height: 1.2; margin: 18px 0 10px; }
  h2 { font-size: 18px; font-weight: 800; margin: 32px 0 10px; padding-top: 10px; border-top: 3px solid var(--k); text-transform: uppercase; letter-spacing: .03em; }
  h3 { font-size: 15px; font-weight: 800; margin: 20px 0 6px; }
  p, ul, ol { margin: 8px 0; } ul, ol { padding-left: 22px; }
  img { max-width: 100%; border: 2px solid var(--k); cursor: zoom-in; display: block; margin: 14px 0 0; }
  img + br { display: none; }
  img + br + em { display: block; font-style: normal; font-family: var(--mono); font-size: 11px; border: 2px solid var(--k); border-top: 0; padding: 4px 8px; margin-bottom: 14px; background: var(--g1); }
  code { background: var(--g1); border: 1px solid var(--g2); padding: 0 4px; font-family: var(--mono); font-size: 12.5px; }
  pre { background: var(--g1); border: 2px solid var(--k); padding: 10px; overflow: auto; } pre code { border: 0; padding: 0; background: none; }
  .math { font-family: var(--mono); } .math .katex { font-size: 1.14em; } .katex-block .katex { font-size: 1.22em; }
  div.math { background: var(--g1); border: 1px solid var(--k); padding: 8px; white-space: pre-wrap; margin: 8px 0; overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; margin: 10px 0; font-size: 13px; display: block; overflow-x: auto; }
  .wide-preview table { display: table; table-layout: auto; }
  th, td { border: 1px solid var(--k); padding: 4px 8px; text-align: left; vertical-align: top; } th { background: var(--g1); font-weight: 800; }
  blockquote { margin: 10px 0; padding: 2px 12px; border-left: 4px solid var(--k); }
  .lightbox { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px; }
  .lightbox img { max-width: 100%; max-height: 85vh; cursor: zoom-out; border: 2px solid var(--w); margin: 0; }
  .lightbox a { color: var(--w); margin-top: 10px; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; }
  .toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--k); color: var(--w); border: 2px solid var(--w); padding: 6px 12px; font: 700 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; opacity: 0; transition: opacity .2s; pointer-events: none; }
  .toast.show { opacity: 1; }
  dialog { width: min(560px, calc(100% - 24px)); max-height: calc(100% - 24px); padding: 18px; border: 3px solid var(--k); }
  dialog::backdrop { background: rgba(0,0,0,.55); }
  #paperDialog label { display: block; margin: 8px 0; }
  #paperDialog textarea { display: block; width: 100%; min-height: 108px; }
  #paperDialog h2 { margin-top: 0; }
  /* manual editing */
  .bar2 .on { background: var(--y); color: var(--k); }
  .bar2 .spacer { flex: 1; }
  .ed-tools { display: none; }
  .editing .ed-tools { display: flex; gap: 6px; margin: -4px 0 10px; }
  .ed-btn { font: 700 11px/1.2 var(--sans); letter-spacing: .04em; text-transform: none; padding: 5px 10px; border: 1.5px solid var(--k); background: #fff; color: var(--k); cursor: pointer; }
  .ed-btn:hover:not(:disabled) { background: var(--k); color: #fff; }
  .ed-btn.primary { background: var(--k); color: #fff; } .ed-btn.primary:hover:not(:disabled) { background: #fff; color: var(--k); }
  .ed-btn.danger:hover:not(:disabled) { background: var(--red); border-color: var(--red); color: #fff; }
  .ed-has-fig { position: relative; }
  .ed-fig { position: absolute; z-index: 2; top: 8px; left: 8px; display: flex; gap: 4px; padding: 4px; background: rgb(255 255 255 / .94); border: 1.5px solid var(--k); }
  .ed-card { margin: 8px 0 16px; padding: 12px; border: 2px solid var(--k); background: var(--g1); }
  .ed-area { display: block; width: 100%; min-height: 14rem; padding: 10px; border: 2px solid var(--k); background: #fff; color: var(--k); font: 13px/1.55 var(--mono); resize: vertical; }
  .ed-hint { margin: 0 0 8px; font-size: 12px; color: #333; } .ed-error { min-height: 1.2em; margin: 6px 0; color: var(--red); font-weight: 700; font-size: 12.5px; }
  .ed-row { display: flex; gap: 8px; }
  .editing .bar2 { box-shadow: inset 0 -4px 0 var(--y); }
  @media print { .ed-tools, .ed-fig { display: none !important; } }
</style>
</head>
<body>
  <div class="bar2">
    <button id="copy" title="Copy the text summary (figures become [Figure N] references)">Copy text</button>
    <button id="zip" title="summary.md + summary.html + images + frames.json">Bundle .zip</button>
    <button id="print">Save as PDF</button>
    <button id="saveHtml">Save as HTML</button>
    <span class="spacer"></span>
    <button id="undoEdit" type="button" title="Undo the last change to the notes" hidden disabled>Undo</button>
    <button id="redoEdit" type="button" title="Redo" hidden disabled>Redo</button>
    <button id="editNotes" type="button" aria-pressed="false" title="Edit the text and move or remove the figures">Edit notes</button>
    <button id="repair" type="button">Fix formatting</button>
    <button id="practice" hidden>Generate practice paper</button>
    <button id="debug" title="TEMP: full plain-text log of every step (transcript, frames, AI calls)" hidden>Debug dump</button>
  </div>
  <div class="meta" id="meta"></div>
  <div class="status" id="status">Loading...</div>
  <article id="out"></article>
  <dialog id="htmlDialog" aria-labelledby="htmlTitle">
    <h2 id="htmlTitle">Save as HTML</h2>
    <p id="htmlStatus" role="status" aria-live="polite"></p>
    <button id="saveLibrary" type="button">Choose library folder</button>
    <button id="saveStandalone" type="button">Save standalone HTML</button>
    <form method="dialog"><button>Close</button></form>
  </dialog>
  <dialog id="paperDialog" aria-labelledby="paperTitle">
    <h2 id="paperTitle">Generate practice paper</h2>
    <form id="paperForm">
      <label for="useAssignments">Add assignment or sample questions?</label>
      <select id="useAssignments"><option value="no">No</option><option value="yes">Yes</option></select>
      <div id="assignmentInputs" hidden>
        <label for="assignmentText">Paste assignment or sample questions</label>
        <textarea id="assignmentText"></textarea>
        <label for="assignmentFiles">Upload question screenshots</label>
        <input id="assignmentFiles" type="file" accept="image/*" multiple>
        <p>OCR runs locally. Images are sent for questions that need visual interpretation or OCR verification.</p>
      </div>
      <div id="paperStatus" role="status" aria-live="polite"></div>
      <button type="submit" id="paperSubmit">Generate</button>
      <button type="button" id="paperCancel">Not now</button>
    </form>
  </dialog>
  <dialog id="repairDialog" aria-labelledby="repairTitle">
    <h2 id="repairTitle">Use Cheap AI to check formatting?</h2>
    <p id="repairDetails"></p>
    <form method="dialog">
      <button value="no" autofocus>No</button>
      <button value="yes">Yes</button>
    </form>
  </dialog>
  <div class="lightbox" id="lb" hidden><img id="lbimg" alt=""><a id="lbopen" target="_blank" rel="noopener">Open original</a></div>
  <div class="toast" id="toast"></div>
  <script src="lib/katex/katex.min.js"></script>
  <script type="module" src="results.js"></script>
</body>
</html>
