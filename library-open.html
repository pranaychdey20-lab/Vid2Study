<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vid2Study library</title>
<link rel="stylesheet" href="lib/katex/katex.min.css">
<link rel="stylesheet" href="assistant.css">
<style>
  /* the screen before a library folder is open; the shelf itself brings its own styles (lib/library-page.js) */
  body { margin: 0; font: 15px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; background: #eef2f0; color: #14232b; }
  #gate { max-width: 34rem; margin: 12vh auto; padding: 0 1.4rem; }
  #gate h1 { margin: 0 0 .4rem; font: 600 2rem/1.15 "Iowan Old Style", Palatino, Georgia, serif; }
  #gate p { color: #5b6d75; margin: .3rem 0 1rem; }
  #gate button { margin: 0 .5rem .5rem 0; padding: .6rem 1.1rem; border: 1px solid #0e6a64; border-radius: 10px; background: #fff; color: #0e6a64; font: inherit; font-weight: 600; cursor: pointer; }
  #gate button.primary { background: #0e6a64; color: #fff; }
  #gate button[hidden] { display: none; }
  #gate .msg { min-height: 1.4em; color: #b13f2d; }
</style>
</head>
<body>
  <main id="gate">
    <h1>Your library</h1>
    <p>Open the folder that holds your saved lectures to read them here with the notes assistant, using the same models and providers as Vid2Study. Lectures appear only after you add them to the library with Save as HTML.</p>
    <button class="primary" id="reopen" type="button" hidden>Open the library</button>
    <button id="choose" type="button">Choose a library folder</button>
    <p class="msg" id="msg" role="status"></p>
  </main>
  <script src="lib/katex/katex.min.js"></script>
  <script type="module" src="library-open.js"></script>
</body>
</html>
